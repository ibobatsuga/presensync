<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGradTailor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGradTailor)"/>
  
  <!-- Outer subtle circular stitch pattern -->
  <circle cx="96" cy="96" r="76" stroke="#4338ca" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity="0.6"/>

  <!-- Golden Tailor Needle angled -->
  <path d="M140 40 L60 148" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Needle Eye -->
  <ellipse cx="134" cy="48" rx="3" ry="8" transform="rotate(-40 134 48)" fill="#1e1b4b"/>

  <!-- Thread looping -->
  <path d="M134 48 C 150 24, 170 55, 148 70 C 130 82, 100 65, 85 88" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Central Clock / Attendance Shield Motif -->
  <circle cx="88" cy="108" r="32" fill="#312e81" stroke="#6366f1" stroke-width="3"/>
  <polyline points="88 88, 88 108, 102 108" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="108" r="4" fill="#f59e0b"/>

  <!-- Checkmark Badge on right -->
  <circle cx="128" cy="128" r="18" fill="#10b981"/>
  <polyline points="120 128, 126 134, 137 122" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
